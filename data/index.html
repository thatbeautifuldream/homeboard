<!doctype html>
<html lang="en" class="scheme-only-dark antialiased">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>MilluBoard</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-dvh bg-black font-sans text-white selection:bg-white selection:text-black">
<main class="isolate mx-auto max-w-4xl p-5 sm:p-8 lg:py-12">
  <header class="flex items-center justify-between gap-4 border-b border-white/15 pb-5"><a href="/" aria-label="Homepage" class="min-w-0"><h1 class="truncate text-xl font-semibold tracking-tight">MilluBoard</h1></a><div class="flex shrink-0 items-center gap-2"><span id="connection-dot" class="size-2 rounded-full bg-white" aria-hidden="true"></span><span id="connection-text">Online</span></div></header>
  <section class="py-8"><dl class="grid grid-cols-2 gap-y-8 sm:grid-cols-4"><div><dt>Uptime</dt><dd id="uptime">—</dd></div><div><dt>Free memory</dt><dd id="heap">—</dd></div><div><dt>Connected clients</dt><dd id="clients">—</dd></div><div><dt>LED</dt><dd id="led">—</dd></div></dl></section>
  <section class="border-t border-white/15 py-8"><h2>Message</h2><p id="message" class="min-h-8 pt-3 font-mono">Loading...</p><form id="message-form" class="flex max-w-xl gap-3 pt-4"><input id="message-input" maxlength="80" required placeholder="Write a local message" class="min-w-0 flex-1 rounded-none border-b border-white/30 bg-transparent py-2"><button id="message-button" class="rounded-md bg-white px-3 py-2 text-black">Set message</button></form><p id="form-status" aria-live="polite"></p></section>
  <section class="border-t border-white/15 py-8"><h2>Onboard LED</h2><p id="led-description">Currently off.</p><button id="led-button" type="button" class="rounded-md px-3 py-2 ring-1 ring-white/30">Toggle LED</button></section>
  <section class="border-t border-white/15 py-8"><h2>Clock display</h2><div class="flex flex-wrap gap-3 pt-4"><button id="seconds-button" type="button" class="rounded-md px-3 py-2 ring-1 ring-white/30"></button><button id="ampm-button" type="button" class="rounded-md px-3 py-2 ring-1 ring-white/30"></button></div></section>
  <footer class="border-t border-white/15 pt-5"><span id="network-address">milluboard.local</span><button id="refresh-button" type="button" class="float-right">Refresh</button></footer>
</main>
<script>
const $ = id => document.getElementById(id);
const formatUptime = ms => { const s = Math.floor(ms / 1000), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m ${s % 60}s`; };
function connection(ok, detail = '') { $('connection-text').textContent = ok ? 'Online' : `Offline${detail ? `: ${detail}` : ''}`; $('connection-dot').classList.toggle('bg-white', ok); $('connection-dot').classList.toggle('bg-zinc-600', !ok); }
async function api(path, options = {}) { let token = localStorage.getItem('milluboard-api-token'); if (!token) { token = prompt('MilluBoard API token'); if (!token) throw Error('API token required'); localStorage.setItem('milluboard-api-token', token); } const response = await fetch(path, { ...options, headers: { ...(options.headers || {}), Authorization: `Bearer ${token}` } }); if (response.status === 401) { localStorage.removeItem('milluboard-api-token'); throw Error('Invalid API token. Press Refresh and enter it again.'); } return response; }
let refreshInFlight = false;
async function refresh() { if (refreshInFlight) return; refreshInFlight = true; const controller = new AbortController(); const timeout = setTimeout(() => controller.abort(), 5000); try { const response = await api('/api/v1/status', { cache: 'no-store', signal: controller.signal }); if (!response.ok) throw Error(`HTTP ${response.status}`); const s = await response.json(); $('message').textContent = s.message; $('uptime').textContent = formatUptime(s.uptime_ms); $('heap').textContent = Math.round(s.free_heap / 1024) + ' KB'; $('clients').textContent = s.clients; $('led').textContent = s.led ? 'On' : 'Off'; $('led-description').textContent = s.led ? 'Currently on.' : 'Currently off.'; $('seconds-button').textContent = s.clock_seconds ? 'Disable seconds' : 'Enable seconds'; $('ampm-button').textContent = s.clock_ampm ? 'Disable AM/PM' : 'Enable AM/PM'; $('network-address').textContent = s.ip + ' · ' + s.hostname; $('form-status').textContent = ''; connection(true); } catch (e) { $('form-status').textContent = e.message; connection(false, e.message); } finally { clearTimeout(timeout); refreshInFlight = false; } }
$('refresh-button').addEventListener('click', refresh);
$('led-button').addEventListener('click', async () => { try { await api('/api/v1/led', { method: 'POST' }); await refresh(); } catch (e) { connection(false, e.message); $('form-status').textContent = e.message; } });
async function setClockOption(path, value) { try { await api(path, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: String(!value) }); await refresh(); } catch (e) { connection(false, e.message); $('form-status').textContent = e.message; } }
$('seconds-button').addEventListener('click', () => setClockOption('/api/v1/clock/seconds', $('seconds-button').textContent === 'Disable seconds'));
$('ampm-button').addEventListener('click', () => setClockOption('/api/v1/clock/ampm', $('ampm-button').textContent === 'Disable AM/PM'));
$('message-form').addEventListener('submit', async e => { e.preventDefault(); const button = $('message-button'); button.disabled = true; $('form-status').textContent = 'Saving...'; try { await api('/api/v1/display/message', { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: $('message-input').value }); $('message-input').value = ''; $('form-status').textContent = 'Saved.'; await refresh(); } catch (e) { $('form-status').textContent = e.message; } finally { button.disabled = false; } });
refresh(); setInterval(refresh, 10000);
</script>
</body>
</html>
